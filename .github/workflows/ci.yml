name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage

      - run: npm run build

      # 真正启动一次 Electron：校验配置落盘与主窗口日志，避免「门禁全绿但应用起不来」
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke.mjs

      # 真实交互 e2e：驱动渲染进程点开配置、保存、切语言，校验整条 IPC 链路
      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e.mjs

      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: node scripts/e2e.mjs
